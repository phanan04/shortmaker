[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tutien-shorts"
version = "0.1.0"
description = "Local-first Vietnamese shorts pipeline backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.9,<3", "pillow>=11,<14", "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.12,<5", "ddgs>=9,<10", "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
speech = ["vieneu"]
captions = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
tutien-backend = "shorts.__main__:main"

[tool.setuptools.packages.find]
include = ["shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
